[project]
name = "theodolite-mcp"
version = "0.1.0"
description = "MCP server for processing theodolite survey field books"
authors = [
    { name = "Gemini CLI", email = "gemini-cli@example.com" }
]
dependencies = [
    "mcp>=0.1.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "ezdxf>=1.1.0",
]

requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "hypothesis>=6.0.0",
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*deprecated.*:UserWarning",
    "ignore:.*deprecated.*:",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "hypothesis>=6.0.0",
    "jsonschema>=4.0.0",
    "coverage>=7.0.0",
]
